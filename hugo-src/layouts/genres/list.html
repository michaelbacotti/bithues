{{ define "page-content" }}
<div style="background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem 1.5rem;text-align:center;margin-bottom:1.25rem;">
  <div style="font-size:.72rem;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.6rem;">Browse by Genre</div>
  <h1 style="font-family:'Lora',serif;font-size:1.75rem;font-weight:700;color:var(--navy);line-height:1.2;margin-bottom:.5rem;">Genres</h1>
  <p style="font-size:.95rem;color:var(--text-mid);max-width:560px;margin:0 auto;">Find reviews organized by genre and category.</p>
</div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;">
  {{ range .Data.Pages }}
  <a href="{{ .RelPermalink }}" style="background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem;text-decoration:none;display:block;transition:box-shadow .15s;">
    <div style="font-family:'Lora',serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.3rem;line-height:1.3;">{{ .Title }}</div>
    {{ with .Description }}<p style="font-size:.82rem;color:var(--text-mid);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.5rem;">{{ . }}</p>{{ end }}
    <div style="font-size:.72rem;color:var(--orange);font-weight:600;">Browse →</div>
  </a>
  {{ end }}
</div>
{{ end }}
