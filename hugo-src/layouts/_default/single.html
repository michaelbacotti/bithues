{{ define "page-content" }}
<div class="feed-section">
  <div class="feed-section-body">
    {{ if .Params.cover }}
    <div style="float:right;margin:0 0 1.5rem 1.5rem;">
      <img src="{{ .Params.cover }}" alt="Cover of {{ .Title }}" style="width:90px;height:auto;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,0.15);" loading="lazy" />
    </div>
    {{ end }}
    <h1 class="page-title" style="font-family:'Libre Baskerville',Georgia,serif;font-size:1.9rem;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:1rem;">{{ .Title }}</h1>
    {{ .Content }}
  </div>
</div>
{{ end }}
