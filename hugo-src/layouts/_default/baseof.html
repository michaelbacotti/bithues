<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  {{ if .Permalink }}<link rel="canonical" href="{{ .Permalink }}" />{{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="{{ "/" | relLangURL }}" class="nav-logo">Bithues</a>
      <div class="nav-links">
        <a href="{{ "/" | relLangURL }}" {{ if eq .RelPermalink "/" }}class="nav-link active"{{ else }}class="nav-link"{{ end }}>Feed</a>
        <a href="{{ "/browse.html" | relLangURL }}" class="nav-link">Browse</a>
        <a href="{{ "/about.html" | relLangURL }}" {{ if eq .RelPermalink "/about/" }}class="nav-link active"{{ else }}class="nav-link"{{ end }}>About</a>
      </div>
    </div>
  </nav>

  <main class="main">
    {{ block "page-content" . }}{{ end }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a href="{{ "/" | relLangURL }}" class="footer-brand">Bithues</a>
      <nav class="footer-nav">
        <a href="{{ "/reviews.html" | relLangURL }}">Reviews</a>
        <a href="{{ "/articles.html" | relLangURL }}">Articles</a>
        <a href="{{ "/stories.html" | relLangURL }}">Stories</a>
        <a href="{{ "/about.html" | relLangURL }}">About</a>
      </nav>
      <p class="footer-copy">&copy; <span id="year"></span> {{ .Site.Title }}. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
