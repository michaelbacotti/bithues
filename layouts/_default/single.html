{{ define "sidebar-left" }}
{{ partial "sidebar-left.html" . }}
{{ end }}

{{ define "sidebar-right" }}
{{ partial "sidebar-right.html" . }}
{{ end }}

{{ define "page-content" }}
<div class="feed-section">
  <div class="feed-section-body">
    <h1 class="page-title" style="font-family:'Lora',serif;font-size:1.9rem;font-weight:700;color:var(--navy);margin-bottom:1rem;">{{ .Title }}</h1>
    {{ .Content }}
  </div>
</div>
{{ end }}
